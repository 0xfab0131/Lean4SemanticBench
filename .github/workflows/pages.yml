# お題（cslib の Commitment / SecretSharing）の解析結果を表示するビューアを GitHub Pages に配置する。
#
# 手元で検証してきた三つのコマンドをそのまま回す（新しい段取りは持ち込まない）:
#   make all TARGET=Debug/Examples                                   … フィクスチャの解析
#   node Graph/make_sample.js                                        … ビューアの代替データ js/sample.js
#   make all TARGET=Debug/Examples MODULES="Cslib.Crypto.Protocols.Commitment Cslib.Crypto.Protocols.SecretSharing" ARGS="--import-all"
# それぞれ init → report → check → web を含む（Commands/Scripts/l4sb.sh）。ldr_check と、最後の
# ldr_render_check を通過した場合だけ Graph/Web を配置する（検査に落ちたレポートは公開しない）。
#
# CI 固有に足すもの:
#   - elan / node / 空き容量の確保。
#   - cslib にはビルド済み成果物の配信が無い（Mathlib の `lake exe cache` に相当するものは無く、
#     Reservoir の表示も互換性だけ）。Mathlib は cache get で取り、cslib はここで一度ビルドして
#     actions/cache に保存する。actions/cache はジョブ成功時しか保存しないので restore / save を分け、
#     save は `if: always()` で失敗時も途中成果を残す（初回が落ちると毎回最初からになる。実測）。
#   - 公開リポジトリの runner は 4 コア・7 GB。lake の並列数を 2 に抑える（L4SB_LAKE_JOBS）。
#   - MODULES をジョブの環境変数に置かない。Makefile の `MODULES ?=` が拾い、フィクスチャの段まで
#     cslib を解析しに行く（実測）。コマンド行でだけ渡す。
#   - --fetch-cache を付ける。キャッシュの復元が古い manifest のもの（restore-keys）でも、Mathlib を
#     ソースからビルドし始めない（取得済みなら差分だけで安価）。
name: pages

on:
  push:
    branches: [main]
    paths:
      - "Graph/**"
      - "Commands/**"
      - "Debug/Examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配置は一度に一つ。進行中のものは止めない（配置の途中で切ると Pages が中途半端になる）
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TARGET: Debug/Examples
  L4SB_LAKE_JOBS: "2"
  CACHE_KEY: l4sb-v2-${{ hashFiles('Debug/Examples/lake-manifest.json', 'Debug/Examples/lean-toolchain') }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      # Mathlib の成果物は数 GB。既定の runner は空きが十分でないことがあるので、不要な SDK を外す
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -n 1
          free -h | head -n 2
          nproc

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # 鍵は対象の manifest と toolchain。解析器のソースは鍵に入れない（衛星の stamp がソースの
      # 変更を検出して再複写・再ビルドする）。保存は末尾の cache/save（失敗時も残す）
      - name: Restore Lean toolchain, packages and builds
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            ${{ env.TARGET }}/.lake
            ${{ env.TARGET }}/.l4sb
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            l4sb-v2-

      - name: Lean toolchain of the target
        run: |
          cd "$TARGET"
          lean --version
          lake --version
          df -h / | tail -n 1

      # 1. フィクスチャの解析（init → 対象ビルド → 解析器ビルド → decl_report → check → web）
      - name: make all TARGET=Debug/Examples
        run: |
          make all TARGET="$TARGET" ARGS="--fetch-cache"
          df -h / | tail -n 1

      # 2. ビューアの代替データ（生成物。Graph/.gitignore）
      - name: node Graph/make_sample.js
        run: node Graph/make_sample.js

      # 3. お題の解析。埋め込み（Graph/Web/js/default-report.js）をこれで上書きする
      - name: make all … MODULES="Cslib.Crypto.Protocols.Commitment Cslib.Crypto.Protocols.SecretSharing" ARGS="--import-all"
        run: |
          make all TARGET="$TARGET" MODULES="Cslib.Crypto.Protocols.Commitment Cslib.Crypto.Protocols.SecretSharing" ARGS="--import-all --fetch-cache"
          df -h / | tail -n 1

      - name: Render smoke test (DOM stand-in)
        run: node Graph/ldr_render_check.js Graph/report.jsonl

      - name: Assemble site
        run: |
          rm -rf site
          mkdir -p site
          cp -r Graph/Web/. site/
          cp Graph/report.jsonl site/report.jsonl
          cp Graph/report.meta.json site/report.meta.json
          touch site/.nojekyll
          ls -la site site/js
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 失敗しても途中成果（toolchain・packages・Mathlib の oleans・cslib のビルド）を残す。
      # 同じ鍵が既に在れば保存は飛ばされる
      - name: Save Lean toolchain, packages and builds
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            ${{ env.TARGET }}/.lake
            ${{ env.TARGET }}/.l4sb
          key: ${{ env.CACHE_KEY }}

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
